[project]
name = "hermes-kernel-browser-plugin"
version = "0.3.0"
description = "Kernel cloud browser provider plugin for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[dependency-groups]
dev = [
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
